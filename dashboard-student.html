<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — UMT LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>

<!-- ════════════════════════════════════════════════════════════════════
       AEDDY CUSTOM STYLING (STUDENT)  — internal CSS only, no HTML/JS changed
       Everything below is additive. Delete this whole <style> block to revert.
       Theme: friendly "student" vibe — soft indigo / sky / lavender.
  ═══════════════════════════════════════════════════════════════════════ -->
  <style>

    /* ---- 0. Theme tokens for the student pages ---- */
    :root{
      --brand:#4f46e5;          /* indigo  */
      --brand-2:#0ea5e9;        /* sky     */
      --brand-soft:#eef2ff;
      --ink:#1e293b;
      --muted:#64748b;
    }

    /* ---- 1. Page background: soft student gradient instead of flat gray ---- */
    body{
      background:
        radial-gradient(1100px 540px at 12% -8%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
        radial-gradient(900px 520px at 100% 0%, #cffafe 0%, rgba(207,250,254,0) 55%),
        linear-gradient(180deg,#f6f8ff 0%, #eef2fb 100%) !important;
      background-attachment: fixed !important;
    }

    /* ---- 2. NAVBAR: centered, bigger, sticky, with a soft glass look ---- */
    nav{
      position: sticky !important;
      top: 0 !important;
      z-index: 50 !important;
      height: 96px !important;
      justify-content: center !important;     /* brand sits in the centre */
      background: rgba(255,255,255,0.82) !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 24px -12px rgba(79,70,229,.35) !important;
      border-bottom: 1px solid #e6e9f5;
    }

    /* Brand block -> horizontal centred lockup, pops in on login */
    nav > div:first-child{
      flex-direction: row !important;
      align-items: center !important;
      gap: 14px !important;
      animation: aeddyPop .7s cubic-bezier(.2,.8,.2,1.25) both;
    }
    @keyframes aeddyPop{
      0%{ opacity:0; transform: translateY(10px) scale(.7); }
      60%{ opacity:1; transform: translateY(0) scale(1.06); }
      100%{ opacity:1; transform: translateY(0) scale(1); }
    }

    /* Logo "U" tile: bigger + gradient + glow */
    nav > div:first-child > div{
      width:48px !important; height:48px !important;
      border-radius:15px !important;
      background:linear-gradient(135deg,var(--brand),var(--brand-2)) !important;
      box-shadow:0 8px 20px -6px rgba(79,70,229,.6) !important;
    }
    nav > div:first-child > div > span{ font-size:24px !important; }

    /* Replace short "UMT LMS" text with the FULL official names (CSS content) */
    nav > div:first-child > span:nth-of-type(1){
      font-size:0 !important;          /* hide original short text, keep it in DOM */
      line-height:1 !important;
      text-align:left;
    }
    nav > div:first-child > span:nth-of-type(1)::before{
      content:"UNIVERSITI MALAYSIA TERENGGANU";
      display:block;
      font-size:19px !important;
      font-weight:800;
      letter-spacing:1.4px;
      background:linear-gradient(90deg,var(--brand),var(--brand-2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    nav > div:first-child > span:nth-of-type(1)::after{
      content:"LEARNING MANAGEMENT SYSTEM";
      display:block;
      font-size:10px !important;
      font-weight:700;
      letter-spacing:3.2px;
      color:var(--muted);
      margin-top:3px;
    }

    /* Role badge ("Student") -> pill that reads as the login type */
    nav > div:first-child > span:nth-of-type(2){
      background:linear-gradient(135deg,#e0e7ff,#cffafe) !important;
      color:var(--brand) !important;
      font-weight:800 !important;
      letter-spacing:.4px;
      box-shadow:0 2px 8px -2px rgba(79,70,229,.4);
    }

    /* Right-hand account area -> pinned right, styled like a small account card */
    nav > div:last-child{
      position:absolute !important;
      right:28px; top:50%;
      transform:translateY(-50%);
      gap:10px !important;
      background:#ffffff;
      border:1px solid #e6e9f5;
      padding:8px 14px !important;
      border-radius:14px;
      box-shadow:0 6px 18px -10px rgba(30,41,59,.35);
    }
    nav > div:last-child #userName{
      color:var(--ink) !important;
      font-weight:700 !important;
    }
    nav > div:last-child a{               /* "Back to Dashboard" link, if present */
      color:var(--brand) !important;
    }
    nav > div:last-child button{
      background:#fff1f2; color:#e11d48 !important;
      padding:5px 12px; border-radius:9px;
      transition:.18s;
    }
    nav > div:last-child button:hover{ background:#ffe4e6; }

    /* ---- 3. TAB BAR: make it stick right under the navbar while scrolling ---- */
    nav + div{
      position: sticky !important;
      top: 96px !important;                 /* == navbar height above */
      z-index: 40 !important;
      background: rgba(255,255,255,0.9) !important;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px -12px rgba(30,41,59,.4);
    }
    /* tab pills: a touch more playful */
    .tab-btn{ border-radius:10px 10px 0 0; transition:.18s; }
    .tab-btn:hover{ background:#eef2ff; }

    /* ---- 4. Section headers: centre the title, float Refresh right as a pill ---- */
    main h2.font-extrabold{ text-align:center; }
    main .flex.justify-between.items-center.mb-6{
      position:relative;
      justify-content:center !important;
    }
    main .flex.justify-between.items-center.mb-6 > h2{ text-align:center; }
    main .flex.justify-between.items-center.mb-6 > :not(h2){
      position:absolute !important; right:0; top:50%;
      transform:translateY(-50%);
    }
    /* the Refresh button rendered as a pill */
    main .flex.justify-between.items-center.mb-6 > button{
      background:#eef2ff; color:var(--brand) !important;
      padding:8px 16px; border-radius:999px;
      box-shadow:0 4px 12px -6px rgba(79,70,229,.5);
      transition:.18s;
    }
    main .flex.justify-between.items-center.mb-6 > button:hover{
      background:#e0e7ff; transform:translateY(-50%) scale(1.04);
    }

    /* ---- 5. Course cards: student vibe — lift, gradient accent strip ---- */
    main .grid > div.bg-white{
      border-radius:20px !important;
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      position:relative; overflow:hidden;
    }
    main .grid > div.bg-white::before{        /* top accent strip */
      content:""; position:absolute; top:0; left:0; right:0; height:4px;
      background:linear-gradient(90deg,var(--brand),var(--brand-2));
      opacity:0; transition:.2s;
    }
    main .grid > div.bg-white:hover{
      transform:translateY(-4px);
      box-shadow:0 18px 36px -18px rgba(79,70,229,.5) !important;
    }
    main .grid > div.bg-white:hover::before{ opacity:1; }

    /* category chip on cards a little more colourful */
    main .grid .bg-indigo-50{
      background:linear-gradient(135deg,#e0e7ff,#ede9fe) !important;
    }

    /* summary stat cards pop a bit */
    #summary-content .grid > div{ transition:transform .2s ease, box-shadow .2s ease; }
    #summary-content .grid > div:hover{
      transform:translateY(-3px);
      box-shadow:0 16px 30px -18px rgba(79,70,229,.5) !important;
    }

    /* gentle entrance for the page body content */
    main{ animation: aeddyFade .5s ease both; }
    @keyframes aeddyFade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

    /* ---- 6. Small-screen safety: relax the centred/absolute layout ---- */
    @media (max-width:680px){
      nav{ height:auto !important; padding:12px 14px !important; justify-content:space-between !important; }
      nav > div:first-child{ flex-direction:row !important; }
      nav > div:first-child > span:nth-of-type(1)::before{ font-size:14px !important; letter-spacing:.6px; }
      nav > div:first-child > span:nth-of-type(1)::after{ font-size:8px !important; letter-spacing:1.6px; }
      nav > div:last-child{ position:static !important; transform:none; box-shadow:none; border:none; padding:0 !important; }
      nav + div{ top:0 !important; }
      main .flex.justify-between.items-center.mb-6{ flex-direction:column; gap:12px; }
      main .flex.justify-between.items-center.mb-6 > :not(h2){ position:static !important; transform:none; }
    }
  </style>

</head>
<body class="bg-gray-50 min-h-screen font-sans">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm px-8 py-4 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
        <span class="text-white font-bold">U</span>
      </div>
      <span class="font-bold text-slate-800">UMT LMS</span>
      <span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-semibold ml-2">Student</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="userName" class="text-sm text-slate-600 font-medium"></span>
      <button onclick="logout()" class="text-sm font-semibold text-red-500 hover:text-red-700">Logout</button>
    </div>
  </nav>

  <!-- Tab Nav -->
  <div class="bg-white border-b border-slate-100 px-8">
    <div class="flex gap-0 max-w-6xl mx-auto">
      <button onclick="showTab('browse')" id="tab-browse"
        class="tab-btn px-5 py-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600">
        Browse Courses
      </button>
      <button onclick="showTab('my-courses')" id="tab-my-courses"
        class="tab-btn px-5 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700">
        My Enrollments
      </button>
      <button onclick="showTab('summary')" id="tab-summary"
        class="tab-btn px-5 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700">
        My Summary
      </button>
      <button onclick="window.location.href='dashboard-progress.html'" id="tab-progress"
  class="tab-btn px-5 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700">
  My Progress
</button>
    </div>
  </div>

  <main class="max-w-6xl mx-auto p-8">

    <!-- Browse Courses Tab -->
    <div id="pane-browse">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-extrabold text-slate-800">Available Courses</h2>
        <button onclick="loadAllCourses()" class="text-sm text-indigo-600 font-semibold hover:underline">↻ Refresh</button>
      </div>
      <!-- Search + filter -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6 flex flex-col md:flex-row gap-3">
        <div class="flex-1">
          <input id="search-input" type="text"
            placeholder="🔍 Search courses by title, description, or category..."
            oninput="debouncedSearch()"
            class="w-full border border-slate-200 px-4 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
        </div>
        <select id="category-filter" onchange="loadAllCourses()"
          class="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-400 min-w-[180px]">
          <option value="all">All Categories</option>
        </select>
        <button onclick="clearSearch()"
          class="text-sm font-semibold text-slate-500 hover:text-slate-700 px-3">
          Clear
        </button>
      </div>
      <div id="result-count" class="text-xs text-slate-400 mb-3"></div>
      <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- My Enrollments Tab -->
    <div id="pane-my-courses" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-extrabold text-slate-800">My Enrolled Courses</h2>
        <button onclick="loadEnrolled()" class="text-sm text-indigo-600 font-semibold hover:underline">↻ Refresh</button>
      </div>
      <div id="enrolled-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Summary Tab -->
    <div id="pane-summary" class="hidden">
      <h2 class="text-2xl font-extrabold text-slate-800 mb-6">My Academic Summary</h2>
      <div id="summary-content"></div>
    </div>

  </main>

  <!-- ═══ Course Detail Modal ═══ -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 flex p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl max-h-[90vh] flex flex-col">
      <!-- Header -->
      <div class="p-6 border-b border-slate-100 flex justify-between items-start">
        <div class="flex-1 pr-4">
          <span id="dm-category" class="text-[10px] font-bold uppercase tracking-wider text-indigo-500 bg-indigo-50 px-2 py-1 rounded-full"></span>
          <h2 id="dm-title" class="text-2xl font-extrabold text-slate-800 mt-3"></h2>
          <p id="dm-instructor" class="text-sm text-slate-500 mt-1"></p>
        </div>
        <button onclick="closeDetail()" class="text-slate-400 hover:text-slate-700 text-3xl leading-none">×</button>
      </div>

      <!-- Scrollable content -->
      <div class="p-6 overflow-y-auto flex-1">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">About this course</h3>
        <p id="dm-description" class="text-sm text-slate-700 leading-relaxed mb-6 whitespace-pre-wrap"></p>

        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Learning Modules</h3>
        <div id="dm-modules" class="space-y-3 mb-4"></div>
      </div>

      <!-- Footer -->
      <div class="p-6 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
        <div id="dm-footer"></div>
        <p id="dm-status" class="text-center text-sm font-semibold mt-2"></p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const API   = window.API_URL;
    const token = localStorage.getItem('lms_token');
    const user  = JSON.parse(localStorage.getItem('lms_user') || 'null');

    if (!user || user.role !== 'student') {
      localStorage.clear(); window.location.href = 'index.html';
    }
    document.getElementById('userName').innerText = user.name;

    let enrolledIds = new Set();
    let currentDetailCourseId = null;

    // ── Tab management ──────────────────────────────────────────────────
    function showTab(tab) {
      ['browse','my-courses','summary'].forEach(t => {
        document.getElementById('pane-' + t).classList.add('hidden');
        document.getElementById('tab-' + t).className =
          'tab-btn px-5 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700';
      });
      document.getElementById('pane-' + tab).classList.remove('hidden');
      document.getElementById('tab-' + tab).className =
        'tab-btn px-5 py-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600';

      if (tab === 'browse')     loadAllCourses();
      if (tab === 'my-courses') loadEnrolled();
      if (tab === 'summary')    loadSummary();
    }

    // ── Fetch enrolled course IDs ────────────────────────────────────────
    async function refreshEnrolledIds() {
      try {
        const res     = await fetch(`${API}/courses/student/my-courses`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const courses = await res.json();
        enrolledIds   = new Set(courses.map(c => c._id));
      } catch { /* silent */ }
    }

    // ── Browse + Search ─────────────────────────────────────────────────
    let searchDebounceTimer = null;
    function debouncedSearch() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(loadAllCourses, 300);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('category-filter').value = 'all';
      loadAllCourses();
    }

    async function loadCategories() {
      try {
        const res  = await fetch(`${API}/courses/categories`);
        const cats = await res.json();
        const sel  = document.getElementById('category-filter');
        sel.innerHTML = '<option value="all">All Categories</option>' +
          cats.map(c => `<option value="${c}">${c}</option>`).join('');
      } catch { /* silent */ }
    }

    async function loadAllCourses() {
      const grid = document.getElementById('course-grid');
      const meta = document.getElementById('result-count');
      const q    = document.getElementById('search-input').value.trim();
      const cat  = document.getElementById('category-filter').value;

      grid.innerHTML = '<p class="text-slate-400 col-span-3 text-center py-10">Loading...</p>';
      meta.innerText = '';

      try {
        await refreshEnrolledIds();

        const params = new URLSearchParams();
        if (q)   params.append('q', q);
        if (cat && cat !== 'all') params.append('category', cat);

        const url     = `${API}/courses/all${params.toString() ? '?' + params.toString() : ''}`;
        const res     = await fetch(url);
        const courses = await res.json();

        if (q || (cat && cat !== 'all')) {
          meta.innerText = `${courses.length} result${courses.length !== 1 ? 's' : ''} found${q ? ` for "${q}"` : ''}`;
        }

        if (!courses.length) {
          grid.innerHTML = `<div class="col-span-3 text-center py-12 bg-white rounded-2xl border-2 border-dashed border-slate-200">
            <p class="text-slate-400">${q || cat !== 'all' ? 'No courses match your search.' : 'No courses published yet.'}</p>
          </div>`;
          return;
        }

        grid.innerHTML = courses.map(c => {
          const isEnrolled = enrolledIds.has(c._id);
          return `
            <div onclick="openDetail('${c._id}')"
              class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 hover:shadow-md hover:border-indigo-200 transition cursor-pointer relative">
              ${isEnrolled
                ? `<span class="absolute top-4 right-4 text-[10px] font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full">✓ Enrolled</span>`
                : ''}
              <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-500 bg-indigo-50 px-2 py-1 rounded-full">
                ${c.category || 'General'}
              </span>
              <h3 class="text-lg font-bold text-slate-800 mt-3 mb-1">${c.title}</h3>
              <p class="text-sm text-slate-500 line-clamp-2">${c.description}</p>
              <p class="text-xs text-slate-400 mt-2">${c.modules?.length || 0} learning module(s)</p>
              <div class="mt-4 pt-4 border-t border-slate-50 flex justify-between items-center">
                <span class="text-xs text-slate-400">by ${c.instructor?.name || 'Unknown'}</span>
                <span class="text-sm font-bold ${isEnrolled ? 'text-emerald-600' : 'text-indigo-600'}">View Details →</span>
              </div>
            </div>`;
        }).join('');
      } catch {
        grid.innerHTML = '<p class="col-span-3 text-center text-red-500">Failed to load courses.</p>';
      }
    }

    // ── Course Detail Modal ─────────────────────────────────────────────
    async function openDetail(courseId) {
      currentDetailCourseId = courseId;
      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');

      document.getElementById('dm-title').innerText       = 'Loading...';
      document.getElementById('dm-category').innerText    = '';
      document.getElementById('dm-instructor').innerText  = '';
      document.getElementById('dm-description').innerText = '';
      document.getElementById('dm-modules').innerHTML     = '';
      document.getElementById('dm-footer').innerHTML      = '';
      document.getElementById('dm-status').innerText      = '';

      try {
        const res    = await fetch(`${API}/courses/${courseId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const course = await res.json();
        renderDetail(course);
      } catch {
        document.getElementById('dm-title').innerText = 'Failed to load course details.';
      }
    }

    function renderDetail(c) {
      const isEnrolled = enrolledIds.has(c._id);

      document.getElementById('dm-category').innerText    = c.category || 'General';
      document.getElementById('dm-title').innerText       = c.title;
      document.getElementById('dm-instructor').innerText  = `Instructor: ${c.instructor?.name || 'Unknown'}`;
      document.getElementById('dm-description').innerText = c.description || 'No description provided.';

      // Modules — expandable accordion with resource access for enrolled students
      const modulesEl = document.getElementById('dm-modules');
      if (!c.modules?.length) {
        modulesEl.innerHTML = '<p class="text-sm text-slate-400 italic">No learning modules added yet.</p>';
      } else {
        modulesEl.innerHTML = c.modules.map((m, i) => {
          // Build resource chips for enrolled students
          const media = m.media || [];
          const resourcesHtml = isEnrolled && media.length
            ? `<div class="mt-3 pt-3 border-t border-slate-100">
                <p class="text-xs font-semibold text-slate-500 mb-2">📎 Resources from instructor:</p>
                <div class="flex flex-wrap gap-1.5">
                  ${media.map(med => {
                    const icons  = {note:'📄',image:'🖼️',video:'🎬'};
                    const colors = {note:'bg-blue-50 text-blue-600 hover:bg-blue-100',image:'bg-emerald-50 text-emerald-600 hover:bg-emerald-100',video:'bg-orange-50 text-orange-600 hover:bg-orange-100'};
                    const rtype  = med.type === 'note' ? 'raw' : med.type;
                    return `<a href="javascript:void(0)" onclick="openMedia('${med.url}','${med.publicId||''}','${rtype}','${med.format||''}')"
                      class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full ${colors[med.type]} font-medium cursor-pointer transition">
                      ${icons[med.type]} ${med.title}
                    </a>`;
                  }).join('')}
                </div>
              </div>`
            : (isEnrolled && !media.length
                ? `<p class="text-xs text-slate-400 mt-2 italic">No resources uploaded for this module yet.</p>`
                : '');

          return `
            <div class="border border-slate-200 rounded-xl overflow-hidden">
              <button onclick="toggleModule('mod-${i}')"
                class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-slate-100 transition flex justify-between items-center">
                <div>
                  <span class="text-xs font-bold text-indigo-600">MODULE ${i+1}</span>
                  <span class="text-sm font-semibold text-slate-800 ml-2">${m.title}</span>
                  ${media.length ? `<span class="ml-2 text-[10px] font-bold text-slate-400">${media.length} resource(s)</span>` : ''}
                </div>
                <span id="mod-${i}-arrow" class="text-slate-400 text-sm">▼</span>
              </button>
              <div id="mod-${i}" class="hidden px-4 py-4 bg-white border-t border-slate-100">
                ${isEnrolled
                  ? `<p class="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">${m.content || '(No text content for this module)'}</p>
                     ${resourcesHtml}`
                  : `<p class="text-sm text-slate-400 italic">🔒 Enroll to access module content and resources</p>`}
              </div>
            </div>`;
        }).join('');
      }

      // Footer action button
      const footerEl = document.getElementById('dm-footer');
      if (isEnrolled) {
        footerEl.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <span class="text-sm font-bold text-emerald-600 flex items-center gap-2">
              <span class="text-lg">✓</span> You are enrolled
            </span>
            <button onclick="closeDetail()"
              class="bg-slate-200 text-slate-700 px-6 py-2 rounded-lg font-bold hover:bg-slate-300 transition">
              Close
            </button>
          </div>`;
      } else {
        footerEl.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <button onclick="closeDetail()"
              class="flex-1 border border-slate-200 text-slate-600 py-3 rounded-lg font-bold hover:bg-slate-50">
              Cancel
            </button>
            <button onclick="confirmEnroll()"
              class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
              Enroll Now
            </button>
          </div>`;
      }
    }

    function toggleModule(id) {
      const el    = document.getElementById(id);
      const arrow = document.getElementById(id + '-arrow');
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        arrow.innerText = '▲';
      } else {
        el.classList.add('hidden');
        arrow.innerText = '▼';
      }
    }

    function closeDetail() {
      document.getElementById('detail-modal').classList.add('hidden');
      currentDetailCourseId = null;
    }

    async function confirmEnroll() {
      const st = document.getElementById('dm-status');
      try {
        const res  = await fetch(`${API}/courses/${currentDetailCourseId}/enroll`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        st.className = res.ok ? 'text-center text-sm font-semibold mt-2 text-emerald-600'
                               : 'text-center text-sm font-semibold mt-2 text-red-500';
        st.innerText = data.message;
        if (res.ok) {
          enrolledIds.add(currentDetailCourseId);
          setTimeout(async () => {
            const r = await fetch(`${API}/courses/${currentDetailCourseId}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            renderDetail(await r.json());
            loadAllCourses();
          }, 800);
        }
      } catch {
        st.className = 'text-center text-sm font-semibold mt-2 text-red-500';
        st.innerText = 'Enrollment failed.';
      }
    }

    // ── My Enrollments ──────────────────────────────────────────────────
    async function loadEnrolled() {
      const list = document.getElementById('enrolled-list');
      list.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-10">Loading...</p>';
      try {
        await refreshEnrolledIds();
        const res     = await fetch(`${API}/courses/student/my-courses`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const courses = await res.json();
        if (!courses.length) {
          list.innerHTML = `<div class="col-span-2 text-center py-16 bg-white rounded-2xl border-2 border-dashed border-slate-200">
            <p class="text-slate-400">You have not enrolled in any courses yet.</p>
            <button onclick="showTab('browse')" class="mt-3 text-sm font-bold text-indigo-600 hover:underline">Browse courses →</button>
          </div>`;
          return;
        }
        list.innerHTML = courses.map(c => `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 hover:shadow-md hover:border-indigo-200 transition">
            <div class="cursor-pointer" onclick="openDetail('${c._id}')">
              <h3 class="text-lg font-bold text-slate-800">${c.title}</h3>
              <p class="text-sm text-slate-500 mt-1 line-clamp-2">${c.description}</p>
              <div class="mt-4 flex items-center justify-between">
                <span class="text-xs text-slate-400">Instructor: ${c.instructor?.name || 'N/A'}</span>
                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">✓ Enrolled</span>
              </div>
              <div class="mt-3 border-t pt-3 flex items-center justify-between">
                <p class="text-xs text-slate-500">
                  <span class="font-bold">${c.modules?.length || 0}</span> module${c.modules?.length !== 1 ? 's' : ''}
                </p>
                <span class="text-sm font-bold text-indigo-600">Open Course →</span>
              </div>
            </div>
            <div class="mt-3 pt-3 border-t border-dashed border-slate-200">
              <button onclick="openSubmitModal('${c._id}', '${c.title.replace(/'/g,'\'')}')"
                class="w-full bg-violet-600 hover:bg-violet-700 text-white text-sm font-bold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
                📤 Submit Assignment
              </button>
            </div>
          </div>
        `).join('');
      } catch {
        list.innerHTML = '<p class="col-span-2 text-center text-red-500">Failed to load enrollments.</p>';
      }
    }

    // ── Summary ─────────────────────────────────────────────────────────
    async function loadSummary() {
      const el = document.getElementById('summary-content');
      try {
        const res  = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        const enrolled = data.enrolledCourses || [];
        const totalModules = enrolled.reduce((a,c) => a + (c.modules?.length||0), 0);
        const totalResources = enrolled.reduce((a,c) =>
          a + (c.modules||[]).reduce((b,m) => b + (m.media?.length||0), 0), 0);
        el.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm text-center">
              <div class="text-4xl font-extrabold text-indigo-600">${enrolled.length}</div>
              <div class="text-sm text-slate-500 mt-1 font-medium">Enrolled Courses</div>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm text-center">
              <div class="text-4xl font-extrabold text-emerald-500">${totalModules}</div>
              <div class="text-sm text-slate-500 mt-1 font-medium">Total Modules</div>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm text-center">
              <div class="text-4xl font-extrabold text-violet-500">${totalResources}</div>
              <div class="text-sm text-slate-500 mt-1 font-medium">Learning Resources</div>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
            <h3 class="font-bold text-slate-700 mb-4">Enrollment Status</h3>
            ${enrolled.length
              ? enrolled.map(c => `
                  <div class="flex items-center justify-between py-3 border-b border-slate-50 last:border-0 cursor-pointer hover:bg-slate-50 px-2 rounded-lg transition" onclick="openDetail('${c._id}')">
                    <div>
                      <span class="font-medium text-slate-700">${c.title}</span>
                      <span class="text-xs text-slate-400 ml-2">${c.modules?.length||0} module(s)</span>
                    </div>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">Active →</span>
                  </div>`).join('')
              : '<p class="text-slate-400 text-sm">No enrollments yet.</p>'}
          </div>`;
      } catch {
        el.innerHTML = '<p class="text-red-500">Failed to load summary.</p>';
      }
    }

    // ── Open media: signed URL for raw/PDF, direct for image/video ──────
    function isPdf(url) {
      return /\.pdf($|\?)/i.test(url) || /\/raw\/upload\//i.test(url);
    }

    async function openMedia(url, publicId, resourceType, format) {
      let finalUrl = url;

      if (resourceType === 'raw' && publicId) {
        try {
          const r = await fetch(
            `${API}/courses/media/signed-url?publicId=${encodeURIComponent(publicId)}&resourceType=raw`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          if (r.ok) {
            const data = await r.json();
            finalUrl = data.url;
          }
        } catch (e) { /* use original url */ }
      }

      // PDFs → Google Docs viewer to avoid browser "Failed to load PDF" error
      const looksLikePdf = (format && format.toLowerCase() === 'pdf') ||
                           isPdf(publicId || '') ||
                           isPdf(finalUrl);
      if (looksLikePdf) {
        const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(finalUrl)}&embedded=false`;
        window.open(viewerUrl, '_blank');
        return;
      }

      window.open(finalUrl, '_blank');
    }


    // ── Assignment Submission Modal ──────────────────────────────────────
    let _submitCourseId   = null;
    let _submitCourseTitle = null;

    function openSubmitModal(courseId, courseTitle) {
      _submitCourseId    = courseId;
      _submitCourseTitle = courseTitle;
      document.getElementById('sm-course-title').innerText = courseTitle;
      document.getElementById('sm-title').value   = '';
      document.getElementById('sm-file').value    = '';
      document.getElementById('sm-file-label').innerHTML = `
        <p class="text-2xl mb-1">📎</p>
        <p class="text-sm font-semibold text-slate-600">Click to choose file</p>
        <p class="text-xs text-slate-400 mt-1">PDF, Word, Excel, PPT, images — max 20 MB</p>`;
      document.getElementById('sm-status').classList.add('hidden');
      document.getElementById('sm-progress-bar').classList.add('hidden');
      document.getElementById('sm-submit-btn').disabled = false;
      document.getElementById('submit-modal').classList.remove('hidden');
    }

    function closeSubmitModal() {
      document.getElementById('submit-modal').classList.add('hidden');
      _submitCourseId = null;
    }

    // Show chosen filename
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('sm-file').addEventListener('change', function() {
        const f = this.files[0];
        if (f) {
          document.getElementById('sm-file-label').innerHTML = `
            <p class="text-2xl mb-1">✅</p>
            <p class="text-sm font-semibold text-slate-700">${f.name}</p>
            <p class="text-xs text-slate-400 mt-1">${(f.size/1024/1024).toFixed(2)} MB</p>`;
        }
      });
    });

    async function doSubmitAssignment() {
      const title  = document.getElementById('sm-title').value.trim();
      const file   = document.getElementById('sm-file').files[0];
      const status = document.getElementById('sm-status');
      const btn    = document.getElementById('sm-submit-btn');

      status.classList.add('hidden');

      if (!title) {
        status.className = 'text-sm font-semibold text-center text-red-500';
        status.innerText = 'Please enter an assignment title.';
        status.classList.remove('hidden');
        return;
      }
      if (!file) {
        status.className = 'text-sm font-semibold text-center text-red-500';
        status.innerText = 'Please choose a file to upload.';
        status.classList.remove('hidden');
        return;
      }

      btn.disabled  = true;
      btn.innerText = 'Uploading…';

      const bar      = document.getElementById('sm-progress-bar');
      const fill     = document.getElementById('sm-progress-fill');
      const progText = document.getElementById('sm-progress-text');
      bar.classList.remove('hidden');

      // Simulate progress during upload
      let pct = 0;
      const ticker = setInterval(() => {
        pct = Math.min(pct + Math.random() * 12, 90);
        fill.style.width = pct + '%';
        progText.innerText = `Uploading… ${Math.round(pct)}%`;
      }, 200);

      try {
        const fd = new FormData();
        fd.append('title', title);
        fd.append('file', file);

        const res  = await fetch(`${API}/progress/course/${_submitCourseId}/submit-assignment`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        const data = await res.json();

        clearInterval(ticker);
        fill.style.width  = '100%';
        progText.innerText = 'Done!';

        if (res.ok) {
          status.className = 'text-sm font-semibold text-center text-emerald-600';
          status.innerText = `✅ "${title}" submitted successfully!`;
          status.classList.remove('hidden');
          btn.innerText = 'Submitted!';
          setTimeout(closeSubmitModal, 1800);
        } else {
          throw new Error(data.message || data.error || 'Submission failed.');
        }
      } catch (err) {
        clearInterval(ticker);
        bar.classList.add('hidden');
        btn.disabled  = false;
        btn.innerText = 'Submit';
        status.className = 'text-sm font-semibold text-center text-red-500';
        status.innerText = '❌ ' + err.message;
        status.classList.remove('hidden');
      }
    }

    function logout() { localStorage.clear(); window.location.href = 'index.html'; }

    // Initial load
    loadCategories();
    loadAllCourses();
  </script>

  <!-- ═══ Assignment Submission Modal ═══ -->
  <div id="submit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 flex p-4">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <div>
          <h2 class="text-lg font-extrabold text-slate-800">Submit Assignment</h2>
          <p id="sm-course-title" class="text-sm text-slate-500 mt-0.5"></p>
        </div>
        <button onclick="closeSubmitModal()" class="text-slate-400 hover:text-slate-700 text-3xl leading-none">×</button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Assignment Title *</label>
          <input id="sm-title" type="text" placeholder="e.g. Week 3 Report"
            class="w-full border border-slate-200 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-violet-400 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">File *</label>
          <label class="block border-2 border-dashed border-slate-200 rounded-xl p-6 text-center cursor-pointer hover:border-violet-400 hover:bg-violet-50 transition" id="sm-drop-zone">
            <input type="file" id="sm-file" class="hidden" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.jpg,.jpeg,.png">
            <div id="sm-file-label">
              <p class="text-2xl mb-1">📎</p>
              <p class="text-sm font-semibold text-slate-600">Click to choose file</p>
              <p class="text-xs text-slate-400 mt-1">PDF, Word, Excel, PPT, images — max 20 MB</p>
            </div>
          </label>
        </div>
        <div id="sm-progress-bar" class="hidden">
          <div class="w-full bg-slate-100 rounded-full h-2">
            <div id="sm-progress-fill" class="bg-violet-500 h-2 rounded-full transition-all duration-300" style="width:0%"></div>
          </div>
          <p id="sm-progress-text" class="text-xs text-slate-500 mt-1 text-center">Uploading...</p>
        </div>
        <p id="sm-status" class="text-sm font-semibold text-center hidden"></p>
      </div>
      <div class="p-6 border-t border-slate-100 flex gap-3">
        <button onclick="closeSubmitModal()"
          class="flex-1 border border-slate-200 text-slate-600 py-2.5 rounded-lg font-bold hover:bg-slate-50 text-sm">
          Cancel
        </button>
        <button onclick="doSubmitAssignment()"
          id="sm-submit-btn"
          class="flex-1 bg-violet-600 text-white py-2.5 rounded-lg font-bold hover:bg-violet-700 transition text-sm shadow-lg shadow-violet-100">
          Submit
        </button>
      </div>
    </div>
  </div>

</body>
</html>
